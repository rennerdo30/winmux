# WinMux session file. Safe to hand-edit — the fields you are most likely to
# want are `program`, `args` and `cwd` on the [[windows.panes]] entries below.
# Restoring recreates processes from these descriptors; it does NOT restore
# process state (scrollback, in-flight jobs, TUI state are out of scope).

version = 1
saved_at = 2026-09-10T12:00:00.000Z

[[windows]]
title   = 'cmd + explorer'
root    = 'n0'
focused = '11111111-1111-1111-1111-111111111111'
bounds  = { x = 0, y = 0, width = 1920, height = 1040 }

# ---- layout tree, flattened. `children` and `root` refer to node ids. ----

[[windows.nodes]]
id        = 'n0'
kind      = 'split'
direction = 'columns'
children  = ['n1', 'n2']
ratios    = [0.5, 0.5]

[[windows.nodes]]
id        = 'n1'
kind      = 'leaf'
pane      = '11111111-1111-1111-1111-111111111111'

[[windows.nodes]]
id        = 'n2'
kind      = 'leaf'
pane      = '22222222-2222-2222-2222-222222222222'

# ---- panes. This is the part worth editing. ----

[[windows.panes]]
id              = '11111111-1111-1111-1111-111111111111'
kind            = 'terminal'
title           = 'cmd'
program         = 'C:\WINDOWS\system32\cmd.exe'
cwd             = 'C:\work\winmux'
cwd_source      = 'shell-reported'
cwd_captured_at = 2026-09-10T12:00:00.000Z
extras          = { cwd_reporting = 'prompt-osc-9-9' }

[[windows.panes]]
id              = '22222222-2222-2222-2222-222222222222'
kind            = 'foreign-app'
title           = 'Explorer'
program         = 'C:\WINDOWS\explorer.exe'
args            = ['C:\work\winmux']
cwd             = 'C:\work\winmux'
cwd_source      = 'launch-directory'
cwd_captured_at = 2026-09-10T12:00:00.000Z
strategy        = 'embed'

[windows.panes.extras]
launch_delay_ms = '2000'
note            = 'explorer.exe exits immediately; the window belongs to the running shell'
window_class    = 'CabinetWClass'
window_match    = 'class'
