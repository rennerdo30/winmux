# A layout that exercises nested tabbing, which a single tab bar at the top of the window
# could not express: two independent tab groups side by side, one with its tabs down the
# left edge and one with tabs across the top, and the right group's second tab holding a
# split rather than a single pane.
#
# Open it with:  .\run.cmd -Session examples\tabs-and-splits.toml
#
# `tabs` on a stack takes 'top' (the default, and omitted when it applies), 'bottom',
# 'left' or 'right'.
#
# NOTE: a session file is LIVE. WinMux saves your layout back to whatever file it opened,
# so opening this one directly would overwrite these comments. run.ps1 copies anything
# under examples\ to a scratch file first; pass -InPlace if you really mean to edit it.

version = 1
saved_at = 2026-09-15T07:30:00.000Z

[[windows]]
title   = 'tabs and splits'
root    = 'n0'
focused = '11111111-1111-1111-1111-111111111111'
bounds  = { x = 0, y = 0, width = 1600, height = 900 }

# ---- layout tree, flattened. `children` and `root` refer to node ids. ----

[[windows.nodes]]
id        = 'n0'
kind      = 'split'
direction = 'columns'
children  = ['n1', 'n4']
ratios    = [0.5, 0.5]

# Left: a tab group listing its tabs down the side.
[[windows.nodes]]
id        = 'n1'
kind      = 'stack'
children  = ['n2', 'n3']
active    = 0
tabs      = 'left'

[[windows.nodes]]
id        = 'n2'
kind      = 'leaf'
pane      = '11111111-1111-1111-1111-111111111111'

[[windows.nodes]]
id        = 'n3'
kind      = 'leaf'
pane      = '22222222-2222-2222-2222-222222222222'

# Right: an ordinary tab group across the top, whose second tab is a split.
[[windows.nodes]]
id        = 'n4'
kind      = 'stack'
children  = ['n5', 'n6']
active    = 0

[[windows.nodes]]
id        = 'n5'
kind      = 'leaf'
pane      = '33333333-3333-3333-3333-333333333333'

[[windows.nodes]]
id        = 'n6'
kind      = 'split'
direction = 'rows'
children  = ['n7', 'n8']
ratios    = [0.5, 0.5]

[[windows.nodes]]
id        = 'n7'
kind      = 'leaf'
pane      = '44444444-4444-4444-4444-444444444444'

[[windows.nodes]]
id        = 'n8'
kind      = 'leaf'
pane      = '55555555-5555-5555-5555-555555555555'

# ---- panes. This is the part worth editing. ----

[[windows.panes]]
id              = '11111111-1111-1111-1111-111111111111'
kind            = 'terminal'
title           = 'build'
program         = 'C:\WINDOWS\system32\cmd.exe'

[[windows.panes]]
id              = '22222222-2222-2222-2222-222222222222'
kind            = 'terminal'
title           = 'tests'
program         = 'C:\WINDOWS\system32\cmd.exe'

[[windows.panes]]
id              = '33333333-3333-3333-3333-333333333333'
kind            = 'file-browser'
title           = 'files'

[[windows.panes]]
id              = '44444444-4444-4444-4444-444444444444'
kind            = 'terminal'
title           = 'top'
program         = 'C:\WINDOWS\system32\cmd.exe'

[[windows.panes]]
id              = '55555555-5555-5555-5555-555555555555'
kind            = 'terminal'
title           = 'bottom'
program         = 'C:\WINDOWS\system32\cmd.exe'
